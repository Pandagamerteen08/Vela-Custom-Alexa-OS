name: ci

# The cross-platform promise is only worth what CI proves, so the host-only
# suite runs on all three operating systems. The kernel and rootfs steps are
# Linux-only by nature (chroot, binfmt, cross toolchain) and are exercised in
# the container job instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    name: host checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Without this the rootfs packer suite reports SKIP on every runner and
      # the 20 MB gate is never actually exercised. One apt install is cheaper
      # than shipping an unchecked packer.
      - name: squashfs-tools (so the packer suite runs instead of skipping)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: doctor
        run: python tools/vela.py doctor

      - name: host checks
        run: python tools/vela.py test

      - name: release packaging works from a bare tree
        run: python tools/vela.py release --version 0.0.0-ci

      - name: pack contains the docs and the checksums verify
        shell: bash
        run: |
          ls -l dist
          cd dist && cd "vela-0.0.0-ci" && \
            if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS.txt; \
            else shasum -a 256 -c SHA256SUMS.txt; fi

  # Advisory, and deliberately so: this job pulls debian:bullseye-slim and
  # alpine:3.20 from Docker Hub on a shared runner IP, which fails intermittently
  # with `toomanyrequests` and has nothing to do with this repository. The host
  # checks above are the gate; this job is evidence you can read, not a blocker.
  # Run it locally to get a trustworthy answer: python tools/vela.py docker test
  container:
    name: container build (advisory, Linux-only steps)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --progress=plain -t vela-build .
      - name: rootfs + kernel sanity inside the container
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work vela-build \
            bash -lc 'kernel/build.sh --check && tools/mkrootfs.sh --dry-run'
