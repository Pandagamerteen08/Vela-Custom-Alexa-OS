# /etc/asound.conf — deliberately almost empty.
#
# The daemon opens the PCM devices directly and mixes in its own process. Loading
# dmix would give every plugin its own shared-memory segment and a second mixing
# path; on 996 MiB that is pure cost for no benefit, and it also makes the
# "hold pcmC0D1c open" workaround (DL1 SRAM panic) harder to guarantee.
#
# The only thing worth configuring globally is the rate converter used when a
# client asks for something other than the hardware rate.

pcm.!default {
    type hw
    card 0
    device 23
}

ctl.!default {
    type hw
    card 0
}

defaults.pcm.rate_converter "speexrate_medium"
