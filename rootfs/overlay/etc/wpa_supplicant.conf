# /etc/wpa_supplicant.conf — template only. There is NO PSK in this file.
#
# Credentials live in /data/wifi.conf (mode 0600) and are handed to the
# supplicant over its control socket, so the key never sits in a config file that
# the supplicant (or a rootfs image) can leak. See docs/design.md §2.11.
#
# Two hard-won settings:
#   * never set `bssid=`: the vendor firmware picks the BSS by SSID, and pinning a
#     BSSID makes it fail on mesh/roaming setups.
#   * wpa_supplicant must be 2.9: 2.11 advertises RSN replay counters this driver
#     does not implement, and the AP deauths with reason 2 ("wrong key").

ctrl_interface=DIR=/run/wpa_supplicant GROUP=root
update_config=0
ap_scan=1

# Managed by velad at runtime:
# network={
#     ssid="..."
#     psk=<64 hex chars from /data/wifi.conf>
#     key_mgmt=WPA-PSK
# }
